apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-web-app
  namespace: cia2-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-web-app
  template:
    metadata:
      labels:
        app: java-web-app
    spec:
      containers:
      - name: java-web-app
        image: DOCKER_IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375

      - name: dind-daemon
        image: docker:27-dind
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""