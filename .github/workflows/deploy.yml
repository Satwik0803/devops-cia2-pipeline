name: End-to-End Cloud CI/CD Pipeline (DinD)

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    container:
      image: docker:24.0.7-dind
      options: --privileged

    steps:
    - name: Install System Dependencies
      run: |
        apk add --no-cache openjdk17 maven git bash curl gettext

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fix Git Safe Directory Permissions
      run: |
        git config --global --add safe.directory "*"

    - name: Run Gitleaks Secret Scanner
      run: |
        curl -sSFL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
        gitleaks detect --redact -v --log-level=debug

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/

    - name: Run Maven Tests
      run: mvn test

    - name: Package with Maven (Clean Build)
      run: mvn clean package -DskipTests

    - name: Verify DinD Connection
      run: |
        docker info

    - name: Log in to Docker Hub via DinD
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image via DinD
      run: |
        IMAGE_TAG=${{ secrets.DOCKER_USERNAME }}/java-web-app:${{ github.sha }}
        docker build --no-cache -t $IMAGE_TAG .
        docker tag $IMAGE_TAG ${{ secrets.DOCKER_USERNAME }}/java-web-app:latest
        docker push $IMAGE_TAG
        docker push ${{ secrets.DOCKER_USERNAME }}/java-web-app:latest

    - name: Set Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Ensure Kubernetes Namespace
      run: |
        kubectl create namespace cia2-demo --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to Kubernetes
      run: |
        sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/java-web-app:${{ github.sha }}|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl rollout status deployment/java-web-app -n cia2-demo --timeout=180s