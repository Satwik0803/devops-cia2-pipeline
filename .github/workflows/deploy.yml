name: End-to-End Cloud CI/CD Pipeline (DinD)

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    container:
      image: docker:27-cli

    services:
      dind:
        image: docker:27-dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""

    env:
      DOCKER_HOST: tcp://dind:2375
      DOCKER_TLS_CERTDIR: ""

    steps:
    - name: Install Build & Cluster Tools
      run: |
        apk add --no-cache git openjdk17 maven kubectl curl bash

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks Secret Scanner
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Maven Tests & Package
      run: |
        mvn test
        mvn clean package -DskipTests

    - name: Wait for DinD Daemon & Log in to Docker Hub
      run: |
        until docker info >/dev/null 2>&1; do sleep 1; done
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and Push Docker Image (via DinD)
      run: |
        IMAGE_TAG=${{ secrets.DOCKER_USERNAME }}/java-web-app:${{ github.sha }}
        docker build --no-cache -t $IMAGE_TAG .
        docker tag $IMAGE_TAG ${{ secrets.DOCKER_USERNAME }}/java-web-app:latest
        docker push $IMAGE_TAG
        docker push ${{ secrets.DOCKER_USERNAME }}/java-web-app:latest

    - name: Deploy to Kubernetes
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config
        kubectl create namespace cia2-demo --dry-run=client -o yaml | kubectl apply -f -
        sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}/java-web-app:${{ github.sha }}|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl rollout status deployment/java-web-app -n cia2-demo --timeout=180s